name: 每日同步上游代码

on:
  schedule:
    # GitHub 使用 UTC：每天 20:17 UTC，即北京时间次日 04:17。
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: 同步上游主分支
    if: github.repository == 'xiaonan-37021/api-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取上游更新并保留本仓库修改
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            try {
              // 使用 GitHub 官方同步接口合并父仓库更新，不强制覆盖本仓库。
              const { data } = await github.rest.repos.mergeUpstream({
                owner,
                repo,
                branch: 'main'
              });
              const types = {
                none: '已是最新，无需更新',
                'fast-forward': '已快进同步上游更新',
                merge: '已合并上游更新并保留本仓库提交'
              };
              const result = types[data.merge_type] || '上游同步完成';
              core.info(result);
              await core.summary
                .addHeading('上游代码同步结果')
                .addRaw(`上游仓库：NeteaseCloudMusicApiEnhanced/api-enhanced\n\n`)
                .addRaw(`目标分支：main\n\n`)
                .addRaw(`执行结果：${result}\n\n`)
                .addRaw(`合并提交：${data.merge_commit_sha || '无新增提交'}\n`)
                .write();
            } catch (error) {
              const status = error.status || '未知';
              const message = status === 409 || status === 422
                ? '同步失败：可能存在合并冲突，请检查上游变化并手动处理；本仓库未被强制覆盖。'
                : status === 403
                  ? '同步失败：GitHub 拒绝操作，请检查 Actions 写入权限；若上游修改了工作流，可能需要手动同步。'
                  : `同步失败：GitHub 接口返回状态码 ${status}，请查看运行日志后重试。`;
              core.setFailed(message);
              await core.summary.addHeading('上游代码同步失败').addRaw(message).write();
            }
